<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 240" width="1280" height="240">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d0d33"/>
      <stop offset="0.55" stop-color="#140926"/>
      <stop offset="1" stop-color="#0a0512"/>
    </linearGradient>
    <radialGradient id="moon" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff4cc"/>
      <stop offset="0.7" stop-color="#e9cf86"/>
      <stop offset="1" stop-color="#b89140"/>
    </radialGradient>
    <radialGradient id="fire" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c0"/>
      <stop offset="0.4" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#d1400a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="arcane" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="0.5" stop-color="#7fd4ff"/>
      <stop offset="1" stop-color="#3a6dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="holy" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd84a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="moonglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="card"><rect x="1" y="1" width="1278" height="238" rx="18"/></clipPath>
    <style>
      .a { transform-box: fill-box; }
      .bob   { animation: bob 2.4s ease-in-out infinite; }
      .bob2  { animation: bob 2.4s ease-in-out -0.6s infinite; }
      .bob3  { animation: bob 2.4s ease-in-out -1.2s infinite; }
      .bob4  { animation: bob 2.4s ease-in-out -1.8s infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

      .twinkle { animation: twinkle 3s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 0.9; } }

      .warrior { animation: warrior 8s infinite; }
      @keyframes warrior {
        0%, 10%  { transform: translateX(0); animation-timing-function: ease-in; }
        14%, 18% { transform: translateX(150px); animation-timing-function: ease-out; }
        24%, 48% { transform: translateX(0); animation-timing-function: ease-in; }
        52%, 56% { transform: translateX(150px); animation-timing-function: ease-out; }
        62%, 100% { transform: translateX(0); }
      }
      .sword { transform-origin: 0% 100%; animation: sword 8s infinite; }
      @keyframes sword {
        0%, 14%  { transform: rotate(-35deg); }
        18%      { transform: rotate(75deg); }
        22%, 52% { transform: rotate(-35deg); }
        56%      { transform: rotate(75deg); }
        60%, 100% { transform: rotate(-35deg); }
      }

      .bow { transform-origin: 50% 50%; animation: bow 8s infinite; }
      @keyframes bow {
        0%, 18% { transform: scaleX(1); }
        21%     { transform: scaleX(1.25); }
        22.5%, 100% { transform: scaleX(1); }
      }
      .arrow { opacity: 0; animation: arrow 8s linear infinite; }
      @keyframes arrow {
        0%, 22%  { transform: translateX(0); opacity: 0; }
        22.5%    { transform: translateX(0); opacity: 1; }
        30%      { transform: translateX(300px); opacity: 1; }
        30.5%, 100% { transform: translateX(300px); opacity: 0; }
      }

      .orb { transform-origin: 50% 50%; animation: orb 8s infinite; }
      @keyframes orb {
        0%, 26% { transform: scale(1); }
        31%     { transform: scale(1.8); }
        33%, 100% { transform: scale(1); }
      }
      .fireball { opacity: 0; animation: fireball 8s infinite; }
      @keyframes fireball {
        0%, 32%  { transform: translate(0, 0); opacity: 0; animation-timing-function: ease-in; }
        32.5%    { transform: translate(0, 0); opacity: 1; animation-timing-function: ease-in; }
        40%      { transform: translate(392px, 34px); opacity: 1; }
        40.5%, 100% { transform: translate(392px, 34px); opacity: 0; }
      }
      .boom { transform-origin: 50% 50%; opacity: 0; animation: boom 8s infinite; }
      @keyframes boom {
        0%, 40%  { transform: scale(0.2); opacity: 0; }
        40.5%    { transform: scale(0.4); opacity: 1; }
        46%      { transform: scale(1.7); opacity: 0; }
        100%     { transform: scale(1.7); opacity: 0; }
      }

      .heal { transform-origin: 50% 50%; opacity: 0; animation: heal 8s infinite; }
      @keyframes heal {
        0%, 43% { transform: scale(0.4); opacity: 0; }
        45%     { transform: scale(0.8); opacity: 1; }
        51%     { transform: scale(1.4); opacity: 0; }
        100%    { transform: scale(1.4); opacity: 0; }
      }
      .holystaff { transform-origin: 50% 50%; animation: holystaff 8s infinite; }
      @keyframes holystaff {
        0%, 40% { transform: scale(1); }
        44%     { transform: scale(1.9); }
        48%, 100% { transform: scale(1); }
      }

      .bird { transform-origin: 50% 100%; animation: bird 8s infinite; }
      @keyframes bird {
        0%    { transform: translateX(0) rotate(0deg); filter: brightness(1); opacity: 1; }
        17.5% { transform: translateX(0) rotate(0deg); filter: brightness(1); }
        18%   { transform: translateX(10px) rotate(0deg); filter: brightness(2.2); }
        21%   { transform: translateX(0) rotate(0deg); filter: brightness(1); }
        29.5% { transform: translateX(0) rotate(0deg); filter: brightness(1); }
        30%   { transform: translateX(6px) rotate(0deg); filter: brightness(2.2); }
        33%   { transform: translateX(0) rotate(0deg); filter: brightness(1); }
        39.5% { transform: translateX(0) rotate(0deg); filter: brightness(1); }
        40%   { transform: translateX(14px) rotate(0deg); filter: brightness(2.6); }
        45%   { transform: translateX(0) rotate(0deg); filter: brightness(1); }
        55.5% { transform: translateX(0) rotate(0deg); filter: brightness(1); }
        56%   { transform: translateX(10px) rotate(0deg); filter: brightness(2.2); }
        58%   { transform: translateX(10px) rotate(0deg); filter: brightness(1); opacity: 1; animation-timing-function: ease-in; }
        65%   { transform: translateX(26px) rotate(82deg); filter: brightness(1); opacity: 1; }
        71%   { transform: translateX(26px) rotate(82deg); filter: brightness(1); opacity: 0; }
        91%   { transform: translateX(0) rotate(0deg); filter: brightness(1); opacity: 0; }
        100%  { transform: translateX(0) rotate(0deg); filter: brightness(1); opacity: 1; }
      }
      .poof { transform-origin: 50% 50%; opacity: 0; animation: poof 8s infinite; }
      @keyframes poof {
        0%, 64% { transform: scale(0.3); opacity: 0; }
        66%     { transform: scale(0.7); opacity: 0.8; }
        76%     { transform: scale(1.5); opacity: 0; }
        100%    { transform: scale(1.5); opacity: 0; }
      }
      .loot { opacity: 0; animation: loot 8s infinite; }
      @keyframes loot {
        0%, 68% { transform: translateY(8px); opacity: 0; }
        72%     { transform: translateY(0); opacity: 1; }
        86%     { transform: translateY(-14px); opacity: 1; }
        92%, 100% { transform: translateY(-20px); opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <!-- sky -->
    <rect width="1280" height="240" fill="url(#sky)"/>
    <circle cx="880" cy="96" r="90" fill="#e9cf86" opacity="0.25" filter="url(#moonglow)"/>
    <circle cx="880" cy="96" r="58" fill="url(#moon)"/>
    <circle cx="862" cy="84" r="9" fill="#d8bb6c" opacity="0.5"/>
    <circle cx="900" cy="112" r="6" fill="#d8bb6c" opacity="0.45"/>

    <!-- stars -->
    <g fill="#f3e3ff">
      <circle class="twinkle" cx="120" cy="40" r="1.6"/>
      <circle class="twinkle" cx="240" cy="78" r="1.2" style="animation-delay:-1s"/>
      <circle class="twinkle" cx="420" cy="34" r="1.5" style="animation-delay:-2s"/>
      <circle class="twinkle" cx="610" cy="62" r="1.1" style="animation-delay:-0.5s"/>
      <circle class="twinkle" cx="700" cy="28" r="1.6" style="animation-delay:-1.5s"/>
      <circle class="twinkle" cx="1040" cy="44" r="1.4" style="animation-delay:-2.5s"/>
      <circle class="twinkle" cx="1150" cy="86" r="1.2" style="animation-delay:-0.8s"/>
      <circle class="twinkle" cx="1210" cy="30" r="1.5" style="animation-delay:-1.8s"/>
      <circle class="twinkle" cx="1000" cy="130" r="1" style="animation-delay:-2.2s"/>
      <circle class="twinkle" cx="330" cy="120" r="1" style="animation-delay:-0.3s"/>
    </g>

    <!-- distant hills -->
    <path d="M0,176 C120,150 220,160 330,168 C470,178 560,140 700,150 C840,160 960,142 1100,156 C1180,164 1240,158 1280,150 L1280,240 L0,240 Z" fill="#1a0c2c"/>
    <!-- ground -->
    <path d="M0,192 C200,186 400,190 640,188 C880,186 1080,190 1280,186 L1280,240 L0,240 Z" fill="#0d0618"/>
    <path d="M0,192 C200,186 400,190 640,188 C880,186 1080,190 1280,186" fill="none" stroke="#3a2160" stroke-width="2"/>
    <g stroke="#2c1848" stroke-width="2" stroke-linecap="round">
      <path d="M180,190 l-3,-8 M184,190 l1,-9 M188,190 l4,-7"/>
      <path d="M690,188 l-3,-7 M694,188 l1,-8 M698,188 l4,-6"/>
      <path d="M1010,188 l-3,-8 M1014,188 l1,-9 M1018,188 l4,-7"/>
    </g>

    <!-- ===== the party (feet on y=190) ===== -->

    <!-- priest -->
    <g transform="translate(330,190)"><g class="bob4">
      <path d="M-14,0 L-9,-44 L9,-44 L14,0 Z" fill="#e6dcc0"/>
      <path d="M-3,0 L-2,-44 L2,-44 L3,0 Z" fill="#d8b24a"/>
      <path d="M-11,-44 C-11,-56 11,-56 11,-44 Z" fill="#e6dcc0"/>
      <circle cx="0" cy="-56" r="8" fill="#f0d6b8"/>
      <path d="M-10,-54 C-10,-70 10,-70 10,-54 L8,-50 C6,-62 -6,-62 -8,-50 Z" fill="#f4ecd4"/>
      <line x1="16" y1="2" x2="16" y2="-74" stroke="#8a6532" stroke-width="3"/>
      <g class="a holystaff"><circle cx="16" cy="-78" r="6" fill="#ffd84a" filter="url(#glow)"/></g>
    </g></g>

    <!-- mage -->
    <g transform="translate(410,190)"><g class="bob3">
      <path d="M-15,0 L-8,-46 L8,-46 L15,0 Z" fill="#3a4fd1"/>
      <path d="M-15,0 L-12,-14 L12,-14 L15,0 Z" fill="#26339a"/>
      <circle cx="0" cy="-54" r="8" fill="#f0d6b8"/>
      <path d="M-4,-50 L0,-36 L4,-50 Z" fill="#e8e8f0"/>
      <path d="M-16,-58 L16,-58 L4,-64 L10,-92 L-6,-64 Z" fill="#2c3cad"/>
      <rect x="-16" y="-60" width="32" height="4" rx="2" fill="#d8b24a"/>
      <line x1="16" y1="2" x2="16" y2="-74" stroke="#5a3a1a" stroke-width="3"/>
      <g class="a orb"><circle cx="16" cy="-80" r="6" fill="url(#arcane)" filter="url(#glow)"/></g>
    </g></g>

    <!-- hunter -->
    <g transform="translate(488,190)"><g class="bob2">
      <rect x="-9" y="-30" width="7" height="30" fill="#4a3220"/>
      <rect x="2" y="-30" width="7" height="30" fill="#4a3220"/>
      <path d="M-13,-62 L13,-62 L11,-28 L-11,-28 Z" fill="#2f6f5a"/>
      <rect x="-12" y="-34" width="24" height="5" fill="#6b4a26"/>
      <circle cx="0" cy="-70" r="8" fill="#f0d6b8"/>
      <path d="M-11,-66 C-12,-84 10,-86 12,-70 L6,-74 C2,-80 -6,-80 -8,-66 Z" fill="#245446"/>
      <path d="M-14,-60 L-20,-30 L-10,-58 Z" fill="#245446"/>
      <g class="a bow">
        <path d="M14,-84 C30,-70 30,-44 14,-30" fill="none" stroke="#8a5a2a" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="14" y1="-84" x2="14" y2="-30" stroke="#e8e0d0" stroke-width="1"/>
      </g>
    </g></g>

    <!-- warrior -->
    <g transform="translate(570,190)"><g class="warrior"><g class="bob">
      <rect x="-10" y="-30" width="8" height="30" fill="#4b5363"/>
      <rect x="2" y="-30" width="8" height="30" fill="#4b5363"/>
      <path d="M-15,-64 L15,-64 L12,-28 L-12,-28 Z" fill="#7d8799"/>
      <path d="M-2,-64 L2,-64 L2,-28 L-2,-28 Z" fill="#9aa5b8"/>
      <rect x="-13" y="-34" width="26" height="5" fill="#6b3a1e"/>
      <circle cx="-15" cy="-62" r="7" fill="#9aa5b8"/>
      <circle cx="15" cy="-62" r="7" fill="#9aa5b8"/>
      <circle cx="0" cy="-74" r="9" fill="#f0d6b8"/>
      <path d="M-10,-74 C-10,-88 10,-88 10,-74 L10,-72 L-10,-72 Z" fill="#8f99ab"/>
      <path d="M-9,-82 C-18,-86 -20,-96 -16,-100 C-15,-92 -11,-88 -6,-86 Z" fill="#e8dcc0"/>
      <path d="M9,-82 C18,-86 20,-96 16,-100 C15,-92 11,-88 6,-86 Z" fill="#e8dcc0"/>
      <ellipse cx="-8" cy="-46" rx="10" ry="14" fill="#8a1f24" stroke="#d8b24a" stroke-width="2.5"/>
      <path d="M-8,-56 L-8,-36 M-16,-46 L0,-46" stroke="#d8b24a" stroke-width="2"/>
      <g transform="translate(16,-58)"><g class="a sword">
        <line x1="0" y1="0" x2="26" y2="-34" stroke="#dfe5ee" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="-4" y1="-6" x2="6" y2="4" stroke="#d8b24a" stroke-width="3.5" stroke-linecap="round"/>
      </g></g>
    </g></g></g>

    <!-- heal ring on the warrior -->
    <g class="a heal"><ellipse cx="570" cy="150" rx="30" ry="46" fill="url(#holy)"/></g>

    <!-- projectiles -->
    <g class="a arrow">
      <line x1="500" y1="133" x2="530" y2="133" stroke="#e8e0d0" stroke-width="2"/>
      <path d="M530,129 L538,133 L530,137 Z" fill="#c9ced8"/>
      <path d="M500,133 L494,129 M500,133 L494,137" stroke="#c94b3a" stroke-width="2"/>
    </g>
    <g class="a fireball"><circle cx="426" cy="110" r="11" fill="url(#fire)" filter="url(#glow)"/></g>

    <!-- ===== the green bird-man (faces left, feet on y=190) ===== -->
    <g transform="translate(840,190)"><g class="a bird">
      <!-- tail -->
      <path d="M14,-44 L46,-30 L40,-38 L50,-40 L16,-56 Z" fill="#1f5e2a"/>
      <!-- legs -->
      <path d="M-8,0 L-2,-18 L-8,-36 M8,0 L14,-18 L8,-36" fill="none" stroke="#d4a838" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M-8,0 l-8,0 M-8,0 l-5,-3 M8,0 l-8,0 M8,0 l-5,-3" stroke="#d4a838" stroke-width="2.5" stroke-linecap="round"/>
      <!-- body -->
      <ellipse cx="0" cy="-58" rx="19" ry="27" fill="#3e9a4a"/>
      <ellipse cx="-6" cy="-54" rx="10" ry="18" fill="#86c96e"/>
      <rect x="-19" y="-40" width="38" height="7" rx="3" fill="#6b3a1e"/>
      <path d="M-10,-33 L-4,-18 L4,-33 Z" fill="#7a2a2a"/>
      <!-- neck + head -->
      <path d="M-2,-80 C-4,-90 -8,-96 -10,-100" fill="none" stroke="#3e9a4a" stroke-width="12" stroke-linecap="round"/>
      <path d="M-2,-108 L16,-128 L4,-108 M0,-104 L22,-118 L4,-104 M-6,-110 L4,-132 L-2,-110" fill="none" stroke="#2e7d3a" stroke-width="5" stroke-linecap="round"/>
      <path d="M16,-128 l3,-4 M22,-118 l4,-2 M4,-132 l1,-5" stroke="#b6e86a" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="-10" cy="-102" rx="14" ry="12" fill="#4fb35a"/>
      <path d="M-20,-106 C-32,-108 -44,-104 -46,-96 C-40,-98 -32,-98 -22,-96 Z" fill="#e0b23a"/>
      <path d="M-46,-96 C-46,-92 -43,-90 -41,-92" fill="none" stroke="#e0b23a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-13" cy="-105" r="3.2" fill="#ffd23a"/>
      <circle cx="-14" cy="-105" r="1.4" fill="#120400"/>
      <!-- wing-arm + staff -->
      <path d="M-8,-74 C-22,-70 -30,-62 -34,-54 L-26,-58 L-28,-50 L-20,-58 C-16,-64 -10,-66 -4,-68 Z" fill="#2e7d3a"/>
      <line x1="-36" y1="-4" x2="-30" y2="-122" stroke="#6b4420" stroke-width="4" stroke-linecap="round"/>
      <path d="M-30,-122 C-38,-130 -38,-138 -30,-142 C-22,-138 -22,-130 -30,-122 Z" fill="#7cff8a" opacity="0.9" filter="url(#glow)"/>
      <circle cx="-34" cy="-54" r="4.5" fill="#3e9a4a"/>
    </g></g>

    <!-- hit effects at the bird -->
    <g class="a boom"><circle cx="818" cy="144" r="26" fill="url(#fire)"/></g>
    <g class="a poof" fill="#9bd98a">
      <circle cx="850" cy="176" r="18" opacity="0.6"/>
      <circle cx="872" cy="168" r="14" opacity="0.5"/>
      <circle cx="830" cy="170" r="12" opacity="0.5"/>
      <circle cx="858" cy="156" r="10" opacity="0.4"/>
    </g>
    <g class="a loot" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" stroke="#140926" stroke-width="5" paint-order="stroke" stroke-linejoin="round">
      <text x="770" y="140" font-size="24" font-style="italic" fill="#f2c94c">fågel</text>
      <text x="770" y="160" font-size="11" letter-spacing="3" fill="#e9dcc0">= BIRD</text>
    </g>

    <!-- inscription -->
    <g font-family="Georgia, 'Times New Roman', serif" fill="#b9a3d9" text-anchor="middle">
      <text x="640" y="224" font-size="13" letter-spacing="4" opacity="0.75">HAPPY QUESTING</text>
    </g>
    <path d="M470,219 L535,219 M745,219 L810,219" stroke="#f2c94c" stroke-opacity="0.4" stroke-width="1"/>
    <path d="M462,219 l4,-4 4,4 -4,4 z M818,219 l-4,-4 -4,4 4,4 z" fill="#f2c94c" opacity="0.6"/>
  </g>

  <!-- frame -->
  <rect x="1" y="1" width="1278" height="238" rx="18" fill="none" stroke="#f2c94c" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="7" y="7" width="1266" height="226" rx="13" fill="none" stroke="#f2c94c" stroke-opacity="0.12" stroke-width="1"/>
</svg>
