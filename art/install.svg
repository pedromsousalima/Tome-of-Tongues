<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d0d33"/>
      <stop offset="1" stop-color="#0a0512"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2c94c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f2c94c" stop-opacity="0.04"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#f2c94c"/>
    </marker>
    <!-- folder + file icons -->
    <symbol id="folder" viewBox="0 0 20 16">
      <path d="M1,3 C1,2 1.6,1.4 2.5,1.4 L7.5,1.4 L9.5,3.4 L17.5,3.4 C18.4,3.4 19,4 19,5 L19,13.6 C19,14.5 18.4,15 17.5,15 L2.5,15 C1.6,15 1,14.5 1,13.6 Z" fill="#c9a24a"/>
      <path d="M1,6 L19,6 L19,13.6 C19,14.5 18.4,15 17.5,15 L2.5,15 C1.6,15 1,14.5 1,13.6 Z" fill="#e9c66a"/>
    </symbol>
    <symbol id="file" viewBox="0 0 16 20">
