  <text x="40" y="74" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2.5" fill="#9d8bb8">COPY ONE FOLDER FROM THE DOWNLOAD INTO YOUR ADDONS FOLDER</text>

