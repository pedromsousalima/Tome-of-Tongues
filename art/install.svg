  </defs>

  <rect x="1" y="1" width="958" height="428" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="428" rx="16" fill="none" stroke="#f2c94c" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="7" y="7" width="946" height="416" rx="11" fill="none" stroke="#f2c94c" stroke-opacity="0.12"/>

  <!-- title -->
